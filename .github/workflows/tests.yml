name: Verificar produto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check translator tests tools
      - run: ruff format --check translator tests tools
      - name: Obter LVGL de referência
        run: git clone --depth 1 --branch v8.3.11 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Testes Python, compilação C e execução LVGL
        run: LVGL_DIR="$RUNNER_TEMP/lvgl" CC=cc HOST_CC=cc python -m pytest -q tests tools/tests
  extension:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bundle_backend.py
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - name: VS Code no Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        working-directory: extension
      - name: VS Code no macOS e Windows
        if: runner.os != 'Linux'
        run: npm run test:integration
        working-directory: extension
      - run: npm run package
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ runner.os }}
          path: release/*.vsix
          if-no-files-found: error
